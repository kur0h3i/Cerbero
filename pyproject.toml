[project]
name = "cerbero"
version = "0.1.0"
description = "Cerbero — monitor de recursos, contenedores y accesos de server-kuro"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=6.0",
    "docker>=7.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    # Base de datos de zonas horarias por si la imagen no trae /usr/share/zoneinfo.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.heads"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
